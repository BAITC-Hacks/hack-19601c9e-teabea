<style>
:root{
  --bg:#0d1117; --panel:#151b23; --panel2:#1b2330; --line:#2a3340;
  --text:#e6e9ef; --muted:#8b96a5; --accent:#f2b134;
  --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px;}
header .stat{font-size:12px;color:var(--muted);font-family:var(--mono);}
#search{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:7px 10px;border-radius:6px;font-size:13px;width:220px;}
#search:focus{outline:1px solid var(--accent);}
button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:7px 12px;border-radius:6px;font-size:12px;cursor:pointer;}
button:hover{border-color:var(--accent);}
button.active{background:var(--accent);color:#141414;border-color:var(--accent);}
main{flex:1;display:flex;min-height:0;}
#network{flex:1;min-width:0;background:radial-gradient(circle at 30% 20%,#141c26,var(--bg));}
aside{width:340px;border-left:1px solid var(--line);overflow-y:auto;padding:14px;background:var(--panel);flex-shrink:0;}
aside h2{font-size:12px;text-transform:none;color:var(--muted);margin:0 0 8px;font-weight:600;}
.legend{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}
.legend .row{display:flex;align-items:center;gap:8px;font-size:12px;}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:12px;}
.card:hover{border-color:var(--accent);}
.card .gid{font-family:var(--mono);color:var(--muted);font-size:11px;}
.card .role{font-weight:600;margin:3px 0;}
.card .ev{color:var(--muted);line-height:1.4;}
#detail{position:absolute;right:356px;top:64px;width:320px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:16px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
#detail h3{margin:0 0 4px;font-size:14px;}
#detail .role-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;color:#101418;margin-bottom:8px;}
#detail p{font-size:12px;line-height:1.5;color:var(--muted);margin:4px 0;}
#detail .metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;margin:10px 0;font-family:var(--mono);}
#detail .metrics div{background:var(--panel2);padding:6px 8px;border-radius:6px;}
#detail .close{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--muted);}
@media (prefers-color-scheme: light){
  :root{--bg:#f5f6f8;--panel:#fff;--panel2:#eef0f3;--line:#dfe3e8;--text:#1a1f27;--muted:#6b7280;}
}
</style>
</head>

</main>

000008748914100, "role": "coordinator", "priority_score": 0.5816, "why": "связан с 2 seed-клиентами напрямую, betweenness=0.001, точка сочленения сети Кластер 15 (5 seed)  объём входящих 180 000 KZT."}, {"rank": 35, "gid": 100000001530983100, "role": "coordinator", "priority_score": 0.5794, "why": "связан с 2 seed-клиентами напрямую, betweenness=0.000, точка сочленения сети Кластер 2 (7 seed)  объём входящих 564 158 KZT."}, {"rank": 36, "gid": 100000005704413100, "role": "coordinator", "priority_score": 0.5745, "why": "связан с 0 seed-клиентами напрямую, betweenness=0.003, точка сочленения сети Кластер 29 (0 seed)  объём входящих 97 835 KZT."}, {"rank": 37, "gid": 100000006889963100, "role": "coordinator", "priority_score": 0.5729, "why": "связан с 2 seed-клиентами напрямую, betweenness=0.000, точка сочленения сети Кластер 9 (0 seed)  объём входящих 1 431 000 KZT."}, {"rank": 38, "gid": 100000007908818100, "role": "coordinator", "priority_score": 0.5725, "why": "связан с 2 seed-клиентами напрямую, betweenness=0.000, точка сочленения сети Кластер 15 (5 seed)  объём входящих 727 475 KZT."}, {"rank": 39, "gid": 100000002894076100, "role": "coordinator", "priority_score": 0.5673, "why": "связан с 2 seed-клиентами напрямую, betweenness=0.000 Кластер 24 (2 seed)  объём входящих 1 122 782 KZT."}, {"rank": 40, "gid": 100000008637537100, "role": "coordinator", "priority_score": 0.5632, "why": "связан с 2 seed-клиентами напрямую, betweenness=0.000, точка сочленения сети Кластер 6 (3 seed)  объём входящих 619 890 KZT."}], "role_colors": {"consolidator": "#e0554f", "distributor": "#3f8efc", "coordinator": "#f2b134", "transit": "#7fd8be", "terminal": "#9a8cff", "peripheral": "#5b6472"}};
const roleColors = DATA.role_colors;
const nodesById = {}; DATA.nodes.forEach(n => nodesById[n.id]=n);

function fmtKZT(v){ return Math.round(v).toLocaleString('ru-RU') + ' ₸'; }

// legend
const legend = document.getElementById('legend');
Object.entries(roleColors).forEach(([role,color])=>{
  const n = DATA.nodes.filter(n=>n.role===role).length;
  legend.innerHTML += `<div class="row"><span class="dot" style="background:${color}"></span>${role} <span style="color:var(--muted);margin-left:auto">${n}</span></div>`;
});

// top list
const topList = document.getElementById('topList');
DATA.top.slice(0,20).forEach(t=>{
  const n = nodesById[t.gid];
  topList.innerHTML += `<div class="card" onclick="focusNode(${t.gid})">
    <div class="gid">#${t.rank} · gid ${t.gid}</div>
    <div class="role" style="color:${roleColors[t.role]}">${t.role} · priority ${t.priority_score.toFixed(2)}</div>
    <div class="ev">${n.evidence}</div>
  </div>`;
});

document.getElementById('stat').textContent = `${DATA.nodes.length} узлов · ${DATA.edges.length} рёбер · ${DATA.clusters.length} кластеров`;

// build vis datasets
function nodeToVis(n){
  const isTop = DATA.top_gids.includes(n.id);
  return {
    id:n.id,
    label: isTop ? String(n.id).slice(-4) : '',
    color:{background:roleColors[n.role], border: n.is_seed ? '#ffffff':'#00000000'},
    borderWidth: n.is_seed ? 2 : 0,
    shape:'dot',
    size: 6 + Math.min(20, n.priority*24),
    font:{color:'#e6e9ef', size:10}
  };
}
function edgeToVis(e){
  return {from:e.src, to:e.dst, arrows:'to',
    color:{color:'rgba(140,150,165,0.35)', highlight:'#f2b134'},
    width: Math.min(4, 0.5 + Math.log10(e.sum_kzt+1)/3)};
}

const container = document.getElementById('network');
let network = null;

function renderSubset(nodeIds){
  const idset = new Set(nodeIds);
  const visNodes = DATA.nodes.filter(n=>idset.has(n.id)).map(nodeToVis);
  const visEdges = DATA.edges.filter(e=>idset.has(e.src)&&idset.has(e.dst)).map(edgeToVis);
  const dataset = {nodes:new vis.DataSet(visNodes), edges:new vis.DataSet(visEdges)};
  const options = {
    physics:{stabilization:{iterations:120}, barnesHut:{gravitationalConstant:-3000, springLength:80}},
    interaction:{hover:true, tooltipDelay:100},
  };
  network = new vis.Network(container, dataset, options);
  network.on('click', params=>{
    if(params.nodes.length) showDetail(params.nodes[0]);
    else closeDetail();
  });
}

function topAndNeighbors(){
  const ids = new Set(DATA.top_gids);
  DATA.edges.forEach(e=>{
    if(DATA.top_gids.includes(e.src)) ids.add(e.dst);
    if(DATA.top_gids.includes(e.dst)) ids.add(e.src);
  });
  return [...ids];
}

function showDetail(gid){
  const n = nodesById[gid];
  if(!n) return;
  document.getElementById('detail').style.display='block';
  document.getElementById('dGid').textContent = 'gid ' + gid + (n.is_seed?' (seed)':'');
  const badge = document.getElementById('dRole');
  badge.textContent = n.role; badge.style.background = roleColors[n.role];
  document.getElementById('dEvidence').textContent = n.evidence;
  document.getElementById('dMetrics').innerHTML = `
    <div>вход: ${n.in_deg}</div><div>выход: ${n.out_deg}</div>
    <div>получил: ${fmtKZT(n.in_kzt)}</div><div>отдал: ${fmtKZT(n.out_kzt)}</div>
    <div>кластер: ${n.cluster}</div><div>глубина: ${n.depth}</div>
    <div>role_score: ${n.role_score.toFixed(2)}</div><div>priority: ${n.priority.toFixed(2)}</div>`;
}
function closeDetail(){ document.getElementById('detail').style.display='none'; }

function focusNode(gid){
  const ids = new Set([gid]);
  DATA.edges.forEach(e=>{ if(e.src===gid) ids.add(e.dst); if(e.dst===gid) ids.add(e.src); });
  renderSubset([...ids, ...topAndNeighbors()]);
  setTimeout(()=>{ if(network){ network.selectNodes([gid]); network.focus(gid,{scale:1.2, animation:true}); showDetail(gid);} }, 200);
}

document.getElementById('btnTop').onclick = ()=>{
  document.getElementById('btnTop').classList.add('active');
  document.getElementById('btnFull').classList.remove('active');
  renderSubset(topAndNeighbors());
};
document.getElementById('btnFull').onclick = ()=>{
  document.getElementById('btnFull').classList.add('active');
  document.getElementById('btnTop').classList.remove('active');
  renderSubset(DATA.nodes.map(n=>n.id));
};
document.getElementById('search').addEventListener('keydown', ev=>{
  if(ev.key==='Enter'){
    const gid = parseInt(ev.target.value.trim());
    if(nodesById[gid]) focusNode(gid);
    else alert('gid не найден');
  }
});

document.getElementById('btnTop').classList.add('active');
renderSubset(topAndNeighbors());
</script>
