<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>{% include 'lib/vis-9.1.2/vis-network.css' %}
*{box-sizing:border-box}body{margin:0;background:#111923;color:#e9eef3;font:14px system-ui,sans-serif;overflow-x:hidden}#network{height:440px;width:100%;touch-action:none}#detail{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;height:144px;overflow:auto;border-top:1px solid #354353;line-height:1.5}.toolbar{display:flex;align-items:center;gap:8px;padding:16px;flex-wrap:wrap}button{background:#233543;color:#e9eef3;border:1px solid #43576b;border-radius:8px;min-height:40px;padding:8px 16px;cursor:pointer}button:hover,button:focus-visible{border-color:#48d5bd}#motion{border-color:#48d5bd}#status{color:#b4c3d1;font-size:12px}@media(max-width:540px){.toolbar{padding:8px}button{padding:8px}#network{height:408px}}
body{height:100vh;display:grid;grid-template-rows:auto minmax(240px,1fr) 144px}#network{height:100%;min-height:0}#detail{height:144px}
</style>
<script>{% include 'lib/vis-9.1.2/vis-network.min.js' %}</script></head>
<body><div class="toolbar"><button id="motion" aria-pressed="false">Движение / Пауза</button><button id="rebuild">Перестроить граф</button><button id="fit">Вписать в окно</button><span id="status" role="status"></span></div><div id="network"></div><div id="detail">Перетаскивайте шарики, масштабируйте колёсиком. Нажатие на узел открывает подробности и приостанавливает движение. Карточку приложения выбирайте поиском или из топа.</div>
<script>
const nodes=new vis.DataSet({{ nodes|tojson }}),edges=new vis.DataSet({{ edges|tojson }});
const network=new vis.Network(document.getElementById('network'),{nodes,edges},{{ options|safe }});
const bounded={{ bounded|tojson }}, initialSelection={{ selected_id|tojson }};
let moving=!initialSelection, timer=null, wasMoving=false, rebuildFrame=null, generation=0;
function status(){document.getElementById('motion').setAttribute('aria-pressed',String(moving));document.getElementById('status').textContent=moving?'Движение включено':'Пауза';}
function pause(){clearTimeout(timer);if(rebuildFrame!==null){cancelAnimationFrame(rebuildFrame);rebuildFrame=null;}moving=false;network.setOptions({physics:{enabled:false}});status();}
function play(){clearTimeout(timer);if(rebuildFrame!==null){cancelAnimationFrame(rebuildFrame);rebuildFrame=null;}moving=true;network.setOptions({physics:{enabled:true}});network.startSimulation();status();if(bounded)timer=setTimeout(pause,6000);}
document.getElementById('motion').onclick=()=>moving?pause():play();
document.getElementById('fit').onclick=()=>network.fit({animation:{duration:500,easingFunction:'easeInOutQuad'}});
document.getElementById('rebuild').onclick=()=>{
  pause();generation++;const ids=nodes.getIds(),from=network.getPositions(ids),start=performance.now();
  function frame(now){const t=Math.min(1,(now-start)/600),ease=t*t*(3-2*t);ids.forEach((id,i)=>{const a=i*2.399963229728653+generation*0.7,r=28*Math.sqrt(i+1);network.moveNode(id,from[id].x+(r*Math.cos(a)-from[id].x)*ease,from[id].y+(r*Math.sin(a)-from[id].y)*ease);});
    if(t<1){rebuildFrame=requestAnimationFrame(frame);}else{rebuildFrame=null;play();network.fit({animation:{duration:500,easingFunction:'easeInOutQuad'}});}}
  rebuildFrame=requestAnimationFrame(frame);
};
network.on('stabilized',()=>{if(bounded)pause();});
network.on('dragStart',event=>{if(event.nodes.length){wasMoving=moving;play();}});
network.on('dragEnd',event=>{if(event.nodes.length&&!wasMoving)pause();});
network.on('click',event=>{if(event.nodes.length){pause();document.getElementById('detail').textContent=nodes.get(event.nodes[0]).detail;}});
network.fit({animation:false});
if(initialSelection&&nodes.get(initialSelection)){network.selectNodes([initialSelection]);document.getElementById('detail').textContent=nodes.get(initialSelection).detail;pause();}else{play();}
</script></body></html>
