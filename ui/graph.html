<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>{% include 'lib/vis-9.1.2/vis-network.css' %}
body{margin:0;background:#111923;color:#e9eef3;font:13px sans-serif}#network{height:460px;width:100%}#detail{white-space:pre-wrap;padding:12px;max-height:130px;overflow:auto;border-top:1px solid #354353}button{position:absolute;right:12px;top:12px;background:#233543;color:#e9eef3;border:1px solid #48d5bd;padding:7px;z-index:2}</style>
<script>{% include 'lib/vis-9.1.2/vis-network.min.js' %}</script></head>
<body><button onclick="network.setOptions({physics:false});network.fit()">Остановить раскладку / вписать</button><div id="network"></div><div id="detail">Нажмите узел для подробностей. Карточку приложения выбирайте поиском или из топа.</div>
<script>
const nodes=new vis.DataSet({{ nodes|tojson }}),edges=new vis.DataSet({{ edges|tojson }});
const network=new vis.Network(document.getElementById('network'),{nodes,edges},{{ options|safe }});
network.once('stabilizationIterationsDone',()=>network.setOptions({physics:false}));
setTimeout(()=>network.setOptions({physics:false}),4000);
network.on('click',event=>{if(event.nodes.length)document.getElementById('detail').textContent=nodes.get(event.nodes[0]).detail;});
</script></body></html>
